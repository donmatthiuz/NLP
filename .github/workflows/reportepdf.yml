name: Generar PDF de Reporte

on:
  push:
  workflow_dispatch:

jobs:
  convertir:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Verificar si existe Reporte.ipynb y/o Reporte.md
      - name: Verificar existencia de Reporte.ipynb / Reporte.md
        id: check_reporte
        run: |
          if [ -f "Reporte.ipynb" ]; then
            echo "existe_ipynb=true" >> $GITHUB_OUTPUT
          else
            echo "existe_ipynb=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No existe Reporte.ipynb, se omite el proceso"
          fi

          if [ -f "Reporte.md" ]; then
            echo "existe_md=true" >> $GITHUB_OUTPUT
          else
            echo "existe_md=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No existe Reporte.md, se omite el proceso"
          fi

      # 3. Instalar dependencias (solo si existe alguno de los dos)
      - name: Instalar dependencias
        if: steps.check_reporte.outputs.existe_ipynb == 'true' || steps.check_reporte.outputs.existe_md == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic
          pip install nbconvert

      # 4. Convertir Reporte.ipynb a PDF (solo si existe)
      - name: Convertir notebook a PDF
        if: steps.check_reporte.outputs.existe_ipynb == 'true'
        run: |
          echo "📄 Convirtiendo Reporte.ipynb a PDF..."
          jupyter nbconvert --to pdf Reporte.ipynb

      # 5. Convertir Reporte.md a PDF (solo si existe)
      - name: Convertir Markdown a PDF
        if: steps.check_reporte.outputs.existe_md == 'true'
        run: |
          echo "📄 Convirtiendo Reporte.md a PDF..."
          pandoc Reporte.md -o Reporte.pdf --pdf-engine=xelatex -V geometry:margin=1in

      # 6. Commit y push (solo si se genero algun PDF)
      - name: Commit y push
        if: steps.check_reporte.outputs.existe_ipynb == 'true' || steps.check_reporte.outputs.existe_md == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Reporte.pdf || true
          git commit -m "Agregar Reporte.pdf generado automáticamente" || echo "Sin cambios"
          git push https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD