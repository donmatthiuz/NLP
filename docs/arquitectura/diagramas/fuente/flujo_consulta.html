<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="diagrama-tamano" content="1600x1128">
  <title>Flujo de consulta de LiciGT</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="lienzo" id="lienzo" style="width:1600px">
  <div class="cabecera">
    <div class="titulo-principal">Flujo de consulta de LiciGT</div>
    <div class="subtitulo">Ruta por defecto: sesión, reglas, evidencia, generación y revisión humana</div>
  </div>
  <div class="mapa" id="mapa"></div>
  <div id="leyenda"></div>
</div>
<div id="verificacion"></div>
<script src="diagrama.js"></script>
<script>
(function () {
  const D = window.Diagrama, F = D.flecha;
  const PH = 104, DW = 196, DH = 120;
  const Y0 = 44, HC = 950, BOT = Y0 + HC + 12;
  D.init({ w: 1600, h: BOT + 12 });
  D.leyenda('leyenda');
  D.limite({ x: 12, y: 8, w: 1444, h: BOT - 8, etq: 'Sistema LiciGT' });
  D.carril({ id: 'C', x: 24, y: Y0, w: 1420, h: HC, tab: 'C · Consulta RAG' });
  D.marco({ id: 'estado', x: 70, y: Y0 + 10, w: 1358, h: HC - 26, titulo: 'Datos por solicitud:', rol: 'rol 3/4', est: 'ok', campos: 'sesión → tenant_id / usuario · evento, intención, evidencia, presupuesto' });
  const base = { carril: 'C', marco: 'estado' };
  const cy1 = Y0 + 184, cy2 = Y0 + 530, yW = Y0 + 440;
  const rom = (id, x, cy, p) => D.nodo(Object.assign({ id, x, y: cy - DH / 2, w: DW, h: DH, tipo: 'decision', rol: 'rol 3', est: 'ok' }, base, p));
  const pr = (id, x, cy, w, p) => D.nodo(Object.assign({ id, x, y: cy - PH / 2, w, h: PH, tipo: 'codigo', rol: 'rol 3', est: 'ok' }, base, p));
  // fila 1
  D.nodo(Object.assign({ id: 'an', x: 94, y: cy1 - 50, w: 120, h: 100, tipo: 'humano', titulo: 'Analista' }, base));
  pr('ses', 260, cy1, 180, { titulo: 'Acceso API', linea: 'cookie, origen y evento', rol: 'rol 4' });
  rom('g', 484, cy1, { titulo: 'Guardrail', linea: '¿Segura?' });
  rom('e', 730, cy1, { titulo: 'Enrutador', linea: '¿Aplica?' });
  rom('a', 976, cy1, { titulo: 'Ambigüedad', linea: '¿Concreta?' });
  pr('he', 1222, cy1, 180, { titulo: 'Herramienta', linea: 'buscar / extraer / comparar' });
  // fila 2
  pr('re', 94, cy2, 160, { titulo: 'Recuperar', linea: 'híbrida y autorizada', est: 'ok', rol: 'rol 2' });
  rom('al', 324, cy2, { titulo: 'Alertas', linea: '¿Suficiente?', rol: 'rol 2' });
  pr('ge', 590, cy2, 160, { tipo: 'llm', titulo: 'Generar', linea: 'Qwen local' });
  pr('va', 820, cy2, 160, { titulo: 'Validar', linea: 'esquema y citas' });
  pr('rs', 1050, cy2, 160, { tipo: 'salida', sk: 16, titulo: 'Respuesta', linea: 'fuentes y avisos' });
  pr('au', 1280, cy2, 124, { titulo: 'Auditoría', linea: 'en finally', rol: 'rol 4' });
  // excepciones
  const e1 = Y0 + 314, e2 = cy2 + 160;
  const cx = id => D.nodos[id].x + D.nodos[id].w / 2;
  const sx = (id, x, top, t, l, w = 190, rol = 'rol 3') => D.nodo(Object.assign({ id, x: x - w / 2, y: top, w: w, h: 96, tipo: 'salida', sk: 14, sec: true, titulo: t, linea: l, rol, est: 'ok' }, base));
  sx('x0', cx('ses'), e1, 'Error HTTP', 'sesión / acceso', 180, 'rol 4');
  sx('x1', cx('g'), e1, 'Abstención', 'pregunta insegura');
  sx('x2', cx('e'), e1, 'Abstención', 'sin herramienta');
  sx('x3', cx('a'), e1, 'Aclaración', 'pregunta sin objeto');
  sx('x4', cx('he'), e1, 'Error controlado', null, 184);
  D.nodo(Object.assign({ id: 'pg', x: 94, y: e2, w: 160, h: 100, tipo: 'datos', titulo: 'PostgreSQL', rol: 'rol 2', est: 'ok' }, base));
  sx('x5', cx('al'), e2, 'Abstención', 'evidencia insuficiente');
  pr('rg', 590, e2 + 52, 160, { tipo: 'llm', titulo: 'Regenerar', linea: 'máximo una vez' });
  rom('ri', 802, e2 + 60, { titulo: 'Reintento', linea: '¿Cabe?' });
  sx('x6', 1232, e2, 'Salida segura', 'afirmaciones válidas; si no, abstención', 296);
  D.nodo({ id: 'rv', x: 1468, y: e2, w: 124, h: 100, tipo: 'humano', sec: true, titulo: 'Revisor' });
  D.nodo({ id: 'jev', x: 1480, y: Y0 + 26, w: 116, h: 144, tipo: 'externo', titulo: 'JEV', linea: 'variantes de experimento', rol: 'rol 3', est: 'parc' });
  D.nota({ x: 94, y: 104, t: 'Reglas por defecto; JEV fuera de esta ruta. Fechas: verificación por reglas.' });
  D.nota({ x: 94, y: 136, t: 'Reintento: solo con presupuesto disponible y si aún no se ha regenerado.' });
  D.nota({ x: 94, y: 918, t: 'Hasta 3 llamadas de herramienta; la regeneración no ejecuta otra herramienta.' });
  D.nota({ x: 94, y: 948, t: 'Auditoría también en salidas tempranas. Se conservan advertencias y solicitud de revisión.' });

  // flechas principales
  F({ de: 'an', ds: 'e', a: 'ses', as: 'w' });
  F({ de: 'ses', ds: 'e', a: 'g', as: 'w' });
  F({ de: 'g', ds: 'e', a: 'e', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'e', ds: 'e', a: 'a', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'a', ds: 'e', a: 'he', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'he', ds: 'e', a: 're', as: 'n', via: [[1432, null], [null, yW], [cx('re'), null]] });
  F({ de: 're', ds: 'e', a: 'al', as: 'w' });
  F({ de: 'al', ds: 'e', a: 'ge', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'ge', ds: 'e', a: 'va', as: 'w' });
  F({ de: 'va', ds: 'e', a: 'rs', as: 'w', et: [{ t: 'válida', l: 'a' }] });
  const audita = F({ de: 'rs', ds: 'e', a: 'au', as: 'w' });
  // excepciones
  const ex = 'excepcion';
  F({ de: 'ses', ds: 's', a: 'x0', as: 'n', tipo: ex, et: [{ t: 'denegado', l: 'i', f: 0.5 }] });
  F({ de: 'g', ds: 's', a: 'x1', as: 'n', tipo: ex, et: [{ t: 'falla', l: 'd', f: 0.8 }] });
  F({ de: 'e', ds: 's', a: 'x2', as: 'n', tipo: ex, et: [{ t: 'ninguna', l: 'd', f: 0.8 }] });
  F({ de: 'a', ds: 's', a: 'x3', as: 'n', tipo: ex, et: [{ t: 'no', l: 'd', f: 0.8 }] });
  F({ de: 'he', ds: 's', a: 'x4', as: 'n', tipo: ex, et: [{ t: 'falla', l: 'd', f: 0.5 }] });
  F({ de: 'al', ds: 's', a: 'x5', as: 'n', tipo: ex, et: [{ t: 'no', l: 'd', f: 0.8 }] });
  F({ de: 'va', ds: 's', a: 'ri', as: 'n', tipo: ex, et: [{ t: 'inválida / cortada', l: 'd', f: 0.5 }] });
  F({ de: 'ri', ds: 'w', a: 'rg', as: 'e', tipo: ex, et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'rg', ds: 'n', a: 'va', as: 's', aof: -32, tipo: ex, via: [[null, 674], [868, null]], et: [{ t: 'validar otra vez', i: 1, l: 'b' }] });
  F({ de: 'ri', ds: 'e', a: 'x6', as: 'w', tipo: ex, et: [{ t: 'no', l: 'a' }] });
  F({ de: 'rg', ds: 's', a: 'x6', as: 's', tipo: ex, via: [[null, 894], [1232, null]], et: [{ t: 'si falla', i: 1, l: 'a', f: 0.8 }] });
  const revision = F({ de: 'rs', ds: 's', a: 'rv', as: 'n', tipo: 'revision', via: [[null, 674], [1530, null]], et: [{ t: 'si requiere revisión', i: 1, l: 'b' }] });
  F({ de: 're', ds: 's', a: 'pg', as: 'n', tipo: 'datos', et: [{ t: 'consulta', l: 'd', f: 0.5 }] });
  F({ de: 'ge', ds: 'n', a: 'x6', as: 'n', tipo: ex, via: [[null, 508], [1232, null]], hueco: [D.indice(audita), D.indice(revision)], et: [{ t: 'falla', i: 2, l: 'd', f: 0.6 }] });
  D.listo();
})();
</script>
</body>
</html>
