<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="diagrama-tamano" content="1600x1020">
  <title>Flujo de consulta de LiciGT</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="lienzo" id="lienzo" style="width:1600px">
  <div class="cabecera">
    <div class="titulo-principal">Flujo de consulta de LiciGT</div>
    <div class="subtitulo">Carril C del rol 3: compuertas, excepciones y revisión humana</div>
  </div>
  <div class="mapa" id="mapa"></div>
  <div id="leyenda"></div>
</div>
<div id="verificacion"></div>
<script src="diagrama.js"></script>
<script>
(function () {
  const D = window.Diagrama, F = D.flecha;
  const PH = 104, DW = 196, DH = 120;
  const Y0 = 44, HC = 842, BOT = Y0 + HC + 12;
  D.init({ w: 1600, h: BOT + 12 });
  D.leyenda('leyenda');
  D.limite({ x: 12, y: 8, w: 1444, h: BOT - 8, etq: 'Sistema LiciGT' });
  D.carril({ id: 'C', x: 24, y: Y0, w: 1420, h: HC, tab: 'C · Consulta RAG' });
  D.marco({ id: 'estado', x: 70, y: Y0 + 10, w: 1358, h: HC - 26, titulo: 'Estado compartido:', rol: 'rol 3/4', est: 'pend', campos: 'tenant_id, usuario, evento, intención, chunk_ids' });
  const base = { carril: 'C', marco: 'estado' };
  const cy1 = Y0 + 184, cy2 = Y0 + 530, yW = Y0 + 440;
  const rom = (id, x, cy, p) => D.nodo(Object.assign({ id, x, y: cy - DH / 2, w: DW, h: DH, tipo: 'decision', rol: 'rol 3', est: 'ok' }, base, p));
  const pr = (id, x, cy, w, p) => D.nodo(Object.assign({ id, x, y: cy - PH / 2, w, h: PH, tipo: 'codigo', rol: 'rol 3', est: 'ok' }, base, p));
  // fila 1
  D.nodo(Object.assign({ id: 'an', x: 94, y: cy1 - 50, w: 150, h: 100, tipo: 'humano', titulo: 'Analista', rol: 'rol 4', est: 'pend' }, base));
  rom('g', 324, cy1, { titulo: 'Guardrail', linea: '¿Segura?' });
  rom('e', 600, cy1, { titulo: 'Enrutador', linea: '¿Aplica?' });
  rom('a', 876, cy1, { titulo: 'Ambigüedad', linea: '¿Concreta?' });
  pr('he', 1152, cy1, 160, { titulo: 'Herramienta', linea: 'busca y extrae' });
  // fila 2
  pr('re', 94, cy2, 160, { titulo: 'Recuperar', linea: 'híbrida y autorizada', est: 'ok', rol: 'rol 2' });
  rom('al', 324, cy2, { titulo: 'Alertas', linea: '¿Suficiente?', rol: 'rol 2' });
  pr('ge', 590, cy2, 160, { tipo: 'llm', titulo: 'Generar', linea: 'LLM local u OpenAI', est: 'parc' });
  pr('va', 820, cy2, 160, { titulo: 'Validar', linea: 'esquema y citas' });
  pr('rs', 1050, cy2, 160, { tipo: 'salida', sk: 16, titulo: 'Respuesta', linea: 'con fuentes' });
  pr('au', 1280, cy2, 124, { titulo: 'Auditoría', est: 'pend', rol: 'rol 4' });
  // excepciones
  const e1 = Y0 + 314, e2 = cy2 + 160;
  const cx = id => D.nodos[id].x + D.nodos[id].w / 2;
  const sx = (id, x, top, t, l, w = 190) => D.nodo(Object.assign({ id, x: x - w / 2, y: top, w: w, h: 96, tipo: 'salida', sk: 14, sec: true, titulo: t, linea: l, rol: 'rol 3', est: 'ok' }, base));
  sx('x1', cx('g'), e1, 'Abstención', 'entrada inválida');
  sx('x2', cx('e'), e1, 'Abstención', 'sin herramienta');
  sx('x3', cx('a'), e1, 'Aclaración', 'pregunta sin objeto');
  sx('x4', cx('he'), e1, 'Error controlado', null);
  D.nodo(Object.assign({ id: 'pg', x: 94, y: e2, w: 160, h: 100, tipo: 'datos', titulo: 'PostgreSQL', rol: 'rol 2', est: 'ok' }, base));
  sx('x5', cx('al'), e2, 'Abstención', 'evidencia insuficiente');
  sx('x6', cx('va'), e2, 'Salida controlada', '3 llamadas o citas', 230);
  D.nodo(Object.assign({ id: 'rv', x: cx('rs') - 75, y: e2, w: 150, h: 100, tipo: 'humano', sec: true, titulo: 'Revisor', rol: 'rol 4', est: 'pend' }, base));
  D.nodo({ id: 'jev', x: 1480, y: Y0 + 26, w: 116, h: 100, tipo: 'externo', titulo: 'JEV', linea: 'API externa', rol: 'rol 3', est: 'parc' });

  // flechas principales
  F({ de: 'an', ds: 'e', a: 'g', as: 'w', et: [{ t: 'pregunta', l: 'a' }] });
  F({ de: 'g', ds: 'e', a: 'e', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'e', ds: 'e', a: 'a', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'a', ds: 'e', a: 'he', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'he', ds: 'e', a: 're', as: 'n', via: [[1352, null], [null, yW], [cx('re'), null]] });
  F({ de: 're', ds: 'e', a: 'al', as: 'w' });
  F({ de: 'al', ds: 'e', a: 'ge', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'ge', ds: 'e', a: 'va', as: 'w' });
  F({ de: 'va', ds: 'e', a: 'rs', as: 'w', et: [{ t: 'válida', l: 'a' }] });
  F({ de: 'rs', ds: 'e', a: 'au', as: 'w', et: [{ t: 'audita', l: 'a' }] });
  // excepciones
  const ex = 'excepcion';
  F({ de: 'g', ds: 's', a: 'x1', as: 'n', tipo: ex, et: [{ t: 'falla', l: 'd', f: 0.8 }] });
  F({ de: 'e', ds: 's', a: 'x2', as: 'n', tipo: ex, et: [{ t: 'ninguna', l: 'd', f: 0.8 }] });
  F({ de: 'a', ds: 's', a: 'x3', as: 'n', tipo: ex, et: [{ t: 'no', l: 'd', f: 0.8 }] });
  F({ de: 'he', ds: 's', a: 'x4', as: 'n', tipo: ex, et: [{ t: 'falla', l: 'd', f: 0.5 }] });
  F({ de: 'al', ds: 's', a: 'x5', as: 'n', tipo: ex, et: [{ t: 'no', l: 'd', f: 0.8 }] });
  F({ de: 'va', ds: 's', a: 'x6', as: 'n', tipo: ex, et: [{ t: 'citas inválidas', l: 'i', f: 0.5 }] });
  F({ de: 'rs', ds: 's', a: 'rv', as: 'n', tipo: 'revision', et: [{ t: 'conflicto', l: 'd', f: 0.5 }] });
  F({ de: 're', ds: 's', a: 'pg', as: 'n', tipo: 'datos', et: [{ t: 'consulta', l: 'd', f: 0.5 }] });
  // JEV desde tres puntos
  [['g', Y0 + 52, -24], ['e', Y0 + 76, 0], ['he', Y0 + 100, 24]].forEach(d => F({ de: d[0], ds: 'n', a: 'jev', as: 'w', aof: d[2], tipo: 'jev', via: [[null, d[1]]] }));
  D.listo();
})();
</script>
</body>
</html>
