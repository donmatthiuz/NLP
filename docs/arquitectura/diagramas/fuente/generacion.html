<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="diagrama-tamano" content="1600x878">
  <title>Generación y validación de LiciGT</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="lienzo" id="lienzo" style="width:1600px">
  <div class="cabecera">
    <div class="titulo-principal">Generación y validación de LiciGT</div>
    <div class="subtitulo">Prompt acotado, modelo local y citas literales antes de publicar</div>
  </div>
  <div class="mapa" id="mapa"></div>
  <div id="leyenda"></div>
</div>
<div id="verificacion"></div>
<script src="diagrama.js"></script>
<script>
(function () {
  const D = window.Diagrama, F = D.flecha;
  const HS = [176, 176, 336];
  const AY = 44, G = 6;
  const Y = []; HS.reduce((y, h) => { Y.push(y); return y + h + G; }, AY);
  const BOT = Y[Y.length - 1] + HS[HS.length - 1] + 12;
  D.init({ w: 1600, h: BOT + 12 });
  D.leyenda('leyenda');
  D.limite({ x: 12, y: 8, w: 1576, h: BOT - 8, etq: 'Sistema LiciGT' });

  const cy = y => y + 84;
  const exTop = y => cy(y) + 130;
  const base = (carril, rol) => ({ carril, rol: rol || 'rol 3', est: 'ok' });
  const box = (c, y, id, x, w, p) => D.nodo(Object.assign({ id, x, y: cy(y) - 50, w, h: 100, tipo: 'codigo' }, base(c), p));
  const dec = (c, y, id, x, w, p) => D.nodo(Object.assign({ id, x, y: cy(y) - 60, w, h: 120, tipo: 'decision' }, base(c), p));
  const exc = (c, y, id, x, w, p) => D.nodo(Object.assign({ id, x, y: exTop(y), w, h: 96, tipo: 'salida', sk: 14, sec: true }, base(c), p));
  const hum = (c, y, id, x, p) => D.nodo(Object.assign({ id, x, y: cy(y) - 50, w: 130, h: 100, tipo: 'humano', carril: c }, p));
  const lane = (i, id, tab) => D.carril({ id, x: 24, y: Y[i], w: 1552, h: HS[i], tab });
  const cxn = id => D.nodos[id].x + D.nodos[id].w / 2;
  const fin = (id, a, i) => F({ de: id, ds: 'e', a, as: 'n', via: [[1530, null], [null, Y[i] + HS[i] + 3], [cxn(a), null]] });
  const no = (de, a, dof, i0) => F({ de, ds: 's', dof: dof === undefined ? -40 : dof, m: cy(Y[i0]) + 108, a, as: 'n', tipo: 'excepcion' });
  const A = Y[0], B = Y[1], C = Y[2];
  const SI = [{ t: 'sí', l: 'a' }];

  // ---------- A · Evidencia y prompt ----------
  lane(0, 'A', 'A · Prompt');
  D.nodo({ id: 'ev', x: 84, y: cy(A) - 52, w: 270, h: 104, tipo: 'datos', carril: 'A', rol: 'rol 2', est: 'ok', titulo: 'Evidencia', linea: '5 por búsqueda, más conflicto' });
  box('A', A, 'pr', 400, 240, { titulo: 'Presupuesto', linea: '36 000 caracteres' });
  box('A', A, 'ne', 690, 240, { titulo: 'Neutralizar', linea: '< y > del texto' });
  box('A', A, 'al', 980, 220, { titulo: 'Alias', linea: 'F1, F2... por fragmento' });
  box('A', A, 'fe', 1250, 250, { titulo: 'Fechas', linea: 'literal recortado a 60' });

  // ---------- B · Modelo ----------
  lane(1, 'B', 'B · Modelo');
  box('B', B, 'si', 84, 240, { titulo: 'Sistema', linea: 'los fragmentos son datos' });
  box('B', B, 'do', 380, 250, { titulo: 'Documentos', linea: 'F1..Fn con página y tipo' });
  box('B', B, 'pq', 690, 240, { titulo: 'Pregunta', linea: 'al final, entre etiquetas' });
  box('B', B, 'llm', 990, 230, { tipo: 'llm', titulo: 'Qwen3.5-9B', linea: 'local · semilla 42' });
  box('B', B, 'js', 1280, 230, { titulo: 'Salida JSON', linea: 'esquema estricto' });

  // ---------- C · Validación ----------
  lane(2, 'C', 'C · Validación determinista');
  box('C', C, 'es', 84, 140, { titulo: 'Esquema', linea: 'JSON estricto' });
  box('C', C, 'ci', 270, 170, { titulo: 'Citas', linea: 'tramo literal' });
  box('C', C, 'da', 486, 190, { titulo: 'Datos', linea: 'marcadores y literales' });
  box('C', C, 'rv', 722, 190, { titulo: 'Revisión', linea: 'vigencia y conflictos' });
  dec('C', C, 'vd', 958, 190, { titulo: '¿Válida?', linea: 'citas y datos' });
  box('C', C, 'rs', 1194, 130, { tipo: 'salida', sk: 14, titulo: 'Respuesta', linea: 'con citas' });
  box('C', C, 'au', 1370, 160, { rol: 'rol 4', titulo: 'Auditoría', linea: 'en finally' });
  exc('C', C, 'rg', 880, 180, { titulo: 'Regenerar', linea: 'una vez' });
  exc('C', C, 'sg', 1170, 340, { titulo: 'Salida segura', linea: 'lo válido; si no, abstención' });
  D.nota({ x: 84, y: exTop(C) + 68, t: 'La cita debe estar literal en su fragmento' });
  D.nota({ x: 500, y: exTop(C) + 68, t: 'Regeneración: otra semilla, temperatura 0,3' });

  // ---------- flechas ----------
  F({ de: 'ev', ds: 'e', a: 'pr', as: 'w', tipo: 'datos' });
  F({ de: 'pr', ds: 'e', a: 'ne', as: 'w' });
  F({ de: 'ne', ds: 'e', a: 'al', as: 'w' });
  F({ de: 'al', ds: 'e', a: 'fe', as: 'w' });
  fin('fe', 'si', 0);

  F({ de: 'si', ds: 'e', a: 'do', as: 'w' });
  F({ de: 'do', ds: 'e', a: 'pq', as: 'w' });
  F({ de: 'pq', ds: 'e', a: 'llm', as: 'w' });
  F({ de: 'llm', ds: 'e', a: 'js', as: 'w' });
  fin('js', 'es', 1);

  F({ de: 'es', ds: 'e', a: 'ci', as: 'w' });
  F({ de: 'ci', ds: 'e', a: 'da', as: 'w' });
  F({ de: 'da', ds: 'e', a: 'rv', as: 'w' });
  F({ de: 'rv', ds: 'e', a: 'vd', as: 'w' });
  F({ de: 'vd', ds: 'e', a: 'rs', as: 'w', et: SI });
  F({ de: 'rs', ds: 'e', a: 'au', as: 'w' });
  F({ de: 'vd', ds: 's', dof: -40, m: cy(C) + 108, a: 'rg', as: 'n', tipo: 'excepcion', et: [{ t: 'no', i: 2, l: 'i', f: 0.5 }] });
  F({ de: 'vd', ds: 's', dof: 70, m: cy(C) + 108, a: 'sg', as: 'n', tipo: 'excepcion', et: [{ t: 'sin tiempo', i: 1, l: 'a', f: 0.5 }] });
  F({ de: 'rg', ds: 'w', a: 'es', as: 'w', via: [[60, null], [null, cy(C)]], tipo: 'excepcion' });
  F({ de: 'rg', ds: 'e', a: 'sg', as: 'w', tipo: 'excepcion', et: [{ t: 'falla', l: 'a' }] });

  D.listo();
})();
</script>
</body>
</html>
