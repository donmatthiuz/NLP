<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="diagrama-tamano" content="1600x1134">
  <title>Arquitectura general de LiciGT</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="lienzo" id="lienzo" style="width:1600px">
  <div class="cabecera">
    <div class="titulo-principal">Arquitectura general de LiciGT</div>
    <div class="subtitulo">Ingesta, índices y consulta con citas verificables</div>
  </div>
  <div class="mapa" id="mapa"></div>
  <div id="leyenda"></div>
</div>
<div id="verificacion"></div>
<script src="diagrama.js"></script>
<script>
(function () {
  const D = window.Diagrama, F = D.flecha;
  const PH = 104, DW = 196, DH = 120;
  const AY = 44, AH = 152, BY = AY + AH + 6, BH = 140, CY = BY + BH + 6, CH = 454, DY = CY + CH + 6, DHL = 192;
  const BOT = DY + DHL + 12;
  D.init({ w: 1600, h: BOT + 12 });
  D.leyenda('leyenda');
  D.limite({ x: 12, y: 8, w: 1444, h: BOT - 8, etq: 'Sistema LiciGT' });

  // ---------- A: ingesta ----------
  D.carril({ id: 'A', x: 24, y: AY, w: 1420, h: AH, tab: 'A · Ingesta' });
  const cyA = AY + AH / 2;
  const p = (id, x, w, o) => D.nodo(Object.assign({ id, x, y: cyA - PH / 2, w, h: PH, tipo: 'codigo', carril: 'A', rol: 'rol 1', est: 'ok' }, o));
  D.nodo({ id: 'an', x: 84, y: cyA - 50, w: 150, h: 100, tipo: 'humano', carril: 'A', titulo: 'Analista' });
  p('va', 334, 170, { titulo: 'Validar', linea: 'PDF, URL, SHA-256' });
  p('or', 604, 150, { tipo: 'datos', titulo: 'Original' });
  p('ex', 854, 170, { titulo: 'Extraer', linea: 'OCR y calidad' });
  p('pa', 1144, 190, { tipo: 'documento', titulo: 'Fragmentos', linea: 'inyección y ZIP' });

  // ---------- B: índices ----------
  D.carril({ id: 'B', x: 760, y: BY, w: 350, h: BH, tab: 'B · Índices' });
  const pgx = 830, pgw = 250, pgy = BY + (BH - 92) / 2;
  D.nodo({ id: 'pg', x: pgx, y: pgy, w: pgw, h: 92, tipo: 'datos', carril: 'B', titulo: 'PostgreSQL + pgvector', rol: 'rol 2', est: 'ok' });

  D.carril({ id: 'S', x: 24, y: BY, w: 710, h: BH, tab: 'Acceso' });
  D.nodo({ id: 'se', x: 94, y: pgy, w: 280, h: 92, tipo: 'codigo', carril: 'S', titulo: 'Sesión y acceso', linea: 'cookie, origen y empresa', rol: 'rol 4', est: 'ok' });
  D.nodo({ id: 'ht', x: 454, y: pgy, w: 220, h: 92, tipo: 'salida', carril: 'S', sec: true, titulo: 'Rechazo HTTP', linea: 'sin consulta', rol: 'rol 4', est: 'ok' });

  // ---------- C: consulta ----------
  D.carril({ id: 'C', x: 24, y: CY, w: 1420, h: CH, tab: 'C · Consulta' });
  D.marco({ id: 'estado', x: 70, y: CY + 10, w: 1358, h: CH - 26, titulo: 'Por solicitud:', rol: 'rol 3/4', est: 'ok', campos: 'Contexto autenticado; datos locales por etapa' });
  const cy = CY + 184, base = { carril: 'C', marco: 'estado' };
  const xs = []; { let x = 94; [DW, DW, DW, 160, 170, 170].forEach(w => { xs.push(x); x += w + 44.4; }); }
  const rom = (id, x, p2) => D.nodo(Object.assign({ id, x, y: cy - DH / 2, w: DW, h: DH, tipo: 'decision', rol: 'rol 3', est: 'ok' }, base, p2));
  rom('g', xs[0], { titulo: 'Guardrail', linea: '¿Segura?' });
  rom('e', xs[1], { titulo: 'Enrutador', linea: '¿Aplica?' });
  rom('a', xs[2], { titulo: 'Ambigüedad', linea: '¿Concreta?' });
  const pr = (id, i, w, p2) => D.nodo(Object.assign({ id, x: xs[i], y: cy - PH / 2, w, h: PH, tipo: 'codigo', rol: 'rol 3', est: 'ok' }, base, p2));
  pr('he', 3, 160, { titulo: 'Herramienta', linea: 'busca y extrae' });
  pr('ge', 4, 170, { tipo: 'llm', titulo: 'Generar', linea: 'LLM y validación' });
  pr('re', 5, 170, { tipo: 'salida', sk: 16, titulo: 'Respuesta', linea: 'citas verificadas' });
  const ex1 = CY + 314;
  const xr = n => D.nodos[n].x + D.nodos[n].w / 2;
  D.nodo(Object.assign({ id: 'x1', x: 94, y: ex1, w: 866, h: 96, tipo: 'salida', sk: 16, sec: true, titulo: 'Abstención, aclaración o error', linea: 'sin llamar al LLM', rol: 'rol 3', est: 'ok' }, base));
  D.nodo(Object.assign({ id: 'x2', x: 1000, y: ex1, w: 190, h: 96, tipo: 'salida', sk: 14, sec: true, titulo: 'Salida controlada', rol: 'rol 3', est: 'ok' }, base));
  D.nodo(Object.assign({ id: 'rv', x: xr('re') - 75, y: ex1, w: 150, h: 100, tipo: 'humano', sec: true, titulo: 'Revisor' }, base));
  D.nodo({ id: 'jev', x: 1480, y: CY + 26, w: 116, h: 100, tipo: 'externo', titulo: 'JEV', linea: 'Experimento' });

  // ---------- D: servicios ----------
  D.carril({ id: 'D', x: 24, y: DY, w: 1420, h: DHL, tab: 'D · Lista y auditoría' });
  D.nodo({ id: 'au', x: 1090, y: DY + 24, w: 170, h: PH, tipo: 'codigo', carril: 'D', titulo: 'Auditoría', linea: 'sin texto de PDF', rol: 'rol 4', est: 'ok' });

  const lista = { carril: 'D', y: DY + 24, h: PH };
  D.nodo(Object.assign({ id: 'al', x: 94, w: 150, tipo: 'humano', titulo: 'Solicitar lista' }, lista));
  D.nodo(Object.assign({ id: 'pr', x: 304, w: 180, tipo: 'codigo', titulo: 'Proponer lista', linea: 'extraer requisitos', rol: 'rol 3', est: 'ok' }, lista));
  D.nodo(Object.assign({ id: 'co', x: 544, w: 180, tipo: 'humano', titulo: 'Confirmar', linea: 'usuario explícito' }, lista));
  D.nodo(Object.assign({ id: 'li', x: 784, w: 190, tipo: 'codigo', titulo: 'Guardar lista', linea: 'rol analista', rol: 'rol 3', est: 'ok' }, lista));
  D.nota({ x: 304, y: DY + 160, t: 'Acción independiente: sin enrutador ni LLM; sesión y rol analista' });
  D.nota({ x: 330, y: CY + 76, t: 'Reglas por defecto' });
  D.nota({ x: 880, y: CY + 76, t: 'Máx. 3 llamadas; 1 regeneración' });
  D.nota({ x: 880, y: CY + 106, t: 'Fragmentos: datos no confiables' });

  D.nota({ x: 1220, y: CY + 106, t: 'Total o parcial' });

  // ---------- flechas ----------
  const cxn = id => D.nodos[id].x + D.nodos[id].w / 2;
  F({ de: 'an', ds: 'e', a: 'va', as: 'w', et: [{ t: 'PDF y URL', l: 'a' }] });
  F({ de: 'va', ds: 'e', a: 'or', as: 'w' });
  F({ de: 'or', ds: 'e', a: 'ex', as: 'w' });
  F({ de: 'ex', ds: 'e', a: 'pa', as: 'w', et: [{ t: 'texto', l: 'a' }] });
  F({ de: 'pa', ds: 's', a: 'pg', as: 'n', via: [[null, BY + 8], [pgx + pgw / 2, null]] });
  // La consulta solo alcanza el guardrail tras comprobar sesión y acceso.
  F({ de: 'an', ds: 's', a: 'se', as: 'n', aof: cxn('an') - cxn('se') });
  const acceso = F({ de: 'se', ds: 's', dof: cxn('g') - cxn('se'), a: 'g', as: 'n', et: [{ t: 'pregunta', l: 'd', f: 0.72 }] });
  F({ de: 'se', ds: 'e', a: 'ht', as: 'w', tipo: 'excepcion' });
  F({ de: 'g', ds: 'e', a: 'e', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'e', ds: 'e', a: 'a', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'a', ds: 'e', a: 'he', as: 'w', et: [{ t: 'sí', l: 'a' }] });
  F({ de: 'he', ds: 'e', a: 'ge', as: 'w', et: [{ t: 'ok', l: 'a' }] });
  F({ de: 'ge', ds: 'e', a: 're', as: 'w' });
  const ex = 'excepcion';
  F({ de: 'g', ds: 's', a: 'x1', as: 'n', tipo: ex, aof: cxn('g') - cxn('x1'), et: [{ t: 'falla', l: 'd', f: 0.8 }] });
  F({ de: 'e', ds: 's', a: 'x1', as: 'n', tipo: ex, aof: cxn('e') - cxn('x1'), et: [{ t: 'ninguna', l: 'd', f: 0.8 }] });
  F({ de: 'a', ds: 's', a: 'x1', as: 'n', tipo: ex, aof: cxn('a') - cxn('x1'), et: [{ t: 'no', l: 'd', f: 0.8 }] });
  F({ de: 'he', ds: 's', a: 'x1', as: 'n', tipo: ex, aof: cxn('he') - cxn('x1'), et: [{ t: 'falla', l: 'd', f: 0.8 }] });
  F({ de: 'ge', ds: 's', a: 'x2', as: 'n', tipo: ex, aof: cxn('ge') - cxn('x2'), et: [{ t: 'citas inválidas', l: 'i', f: 0.8 }] });
  F({ de: 're', ds: 's', a: 'rv', as: 'n', tipo: 'revision', et: [{ t: 'conflicto', l: 'd', f: 0.5 }] });
  // Herramientas de solo lectura contra los índices de PostgreSQL.
  F({ de: 'he', ds: 'n', dof: -40, a: 'pg', as: 's', aof: 0, tipo: 'datos', via: [[null, BY + BH + 6], [pgx + pgw / 2, null]] });
  // La propuesta de lista es una acción propia; guardar exige confirmación.
  F({ de: 'al', ds: 'e', a: 'pr', as: 'w' });
  F({ de: 'pr', ds: 'e', a: 'co', as: 'w' });
  F({ de: 'co', ds: 'e', a: 'li', as: 'w' });
  F({ de: 'li', ds: 's', a: 'pg', as: 's', aof: -55, tipo: 'datos', via: [[null, DY + 142], [76, null], [null, BY + BH - 8], [pgx + pgw / 2 - 55, null]], hueco: [D.indice(acceso)] });
  // auditoría
  F({ de: 're', ds: 'e', a: 'au', as: 'e', tipo: 'principal', via: [[1416, null], [null, DY + 24 + PH / 2]], et: [{ t: 'audita', i: 2, l: 'a', f: 0.5 }] });
  D.listo();
})();
</script>
</body>
</html>
