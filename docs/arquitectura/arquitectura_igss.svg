<title id="title">Arquitectura general de LiciGT: ingesta y consulta RAG sobre documentos del IGSS</title>
<desc id="desc">Diagrama de dos flujos: ingesta de PDF oficiales del portal del IGSS y consulta RAG con control de permisos por empresa y evento, herramientas de solo lectura, recuperación híbrida, validación de citas, abstención y revisión humana.</desc>
