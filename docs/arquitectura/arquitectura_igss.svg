<text x="270" y="757" class="section">Principios de diseño</text>
<text x="270" y="778" class="note">1. El LLM recibe solo documentos autorizados: el filtro por empresa y evento se aplica en SQL antes de recuperar.</text>
<text x="270" y="801" class="note">2. El agente elige entre tres herramientas de solo lectura; ninguna presenta ofertas ni modifica documentos.</text>
<text x="270" y="824" class="note">3. Una aclaración no reemplaza todo lo anterior: se comparan cláusulas y, si no está claro, decide un humano.</text>
<text x="270" y="847" class="note">4. Todo fragmento recuperado es dato, nunca instrucción. Ningún filtro aislado se considera suficiente.</text>
<text x="270" y="870" class="note">5. Los nodos DECISIÓN son clasificadores acotados con umbral; su implementación se elige mediante evaluación.</text>
</svg>